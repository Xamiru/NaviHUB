appId: dev.xamir.navihub
# productName lives only here, NOT in package.json — app.getName() must stay
# "navihub" so userData remains %APPDATA%\navihub / ~/.config/navihub.
productName: NaviHUB
directories:
  buildResources: assets
  output: dist
files:
  - out/**
  - '!out/**/*.map'
extraResources:
  # Runtime window icon (index.ts loads it from process.resourcesPath when
  # packaged — nativeImage path loading is not reliably asar-transparent).
  - from: assets
    to: assets
asar: true
asarUnpack:
  # Native module must live on real disk, not inside the asar.
  - node_modules/better-sqlite3/**
  # kuromoji dict (~18MB) — tokenizer.ts retargets app.asar -> app.asar.unpacked.
  - node_modules/kuromoji/dict/**
# better-sqlite3 13 bundles N-API binaries for the supported Linux and Windows
# x64 targets. Keep builder rebuilding off so packaging selects those bundled
# platform binaries instead of compiling a host-specific addon.
npmRebuild: false
# Required by the in-app updater (src/main/updater.ts): this block is what makes
# electron-builder emit latest.yml / latest-linux.yml next to the artifacts AND
# embed app-update.yml in the asar. Nothing here publishes — CI builds with
# `--publish never` and uploads via `gh release create`. `private: true` tells
# electron-updater to resolve releases through the authenticated GitHub API
# instead of public download URLs (the repo is private; the token comes from the
# `github.token` setting at runtime).
publish:
  provider: github
  owner: AmirHTaee
  repo: NaviHUB
  private: true
# "Open with NaviHUB" for the PACKAGED builds. On Windows the NSIS installer
# writes the registry entries (the `portable` target can't register anything —
# it has no installer); on Linux this becomes MimeType= in the AppImage's
# generated .desktop, which only reaches the system if the AppImage is
# desktop-integrated. The local dev launcher is handled separately by
# scripts/install-desktop.sh.
#
# Keep this list in step with src/main/openFile.ts:classifyPath — that function
# decides what the app does with a file, this decides what the OS offers it for,
# and a mismatch means a file the OS hands us gets silently ignored.
#
# No per-extension `icon:` keys: electron-builder falls back to the app icon,
# which is the honest result anyway (there is no distinct NaviHUB document type).
fileAssociations:
  - ext: [epub]
    name: EPUB Book
    description: EPUB book
    mimeType: application/epub+zip
    role: Viewer
  - ext: [cbz]
    name: Comic Archive
    description: Comic book archive
    mimeType: application/vnd.comicbook+zip
    role: Viewer
  - ext: [mp3, flac, m4a, aac, ogg, opus, wav]
    name: Audio
    description: Audio
    mimeType: audio/mpeg
    role: Viewer
win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  # Don't auto-launch after install: the library bundle must be copied into
  # %APPDATA%\navihub BEFORE first run (see the export bundle's README.txt).
  runAfterFinish: false
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
linux:
  # AppImage is the distributed artifact (CI publishes it to GitHub Releases).
  # `npm run pack:linux` passes `--linux dir` on the command line, which
  # overrides this — that path is still the local packaged-mode smoke test.
  target: [AppImage]
  icon: assets/icon.png
  category: AudioVideo
  # Sets the window's WM_CLASS to match package.json `desktopName`, so the running
  # window associates with the user's own navihub.desktop shortcut instead of
  # showing as a separate generic taskbar entry.
  syncDesktopName: true
appImage:
  artifactName: ${productName}-${version}.${ext}
