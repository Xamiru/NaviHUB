name: Release

on:
  push:
    branches: [main]

# Two pushes in quick succession queue instead of racing to publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Version scheme: +0.1 per commit, staying in 0.x forever (0.9.0 -> 0.10.0).
  #   minor = BASE_MINOR + (commit count - BASE_COMMITS)
  # The baseline below pins "7 commits == 0.2.0". Change both together, and only
  # to deliberately re-baseline the numbering.
  BASE_COMMITS: 7
  BASE_MINOR: 2
  NODE_VERSION: '20'

jobs:
  # Gate for the build jobs, and the single place the version is computed —
  # downstream jobs read it from this job's output so all three agree by
  # construction rather than by recomputing the same formula.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Required: the default shallow clone makes `git rev-list --count`
          # return 1, which would produce the same wrong version every run.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Compute version
        id: version
        run: |
          count=$(git rev-list --count HEAD)
          minor=$(( BASE_MINOR + count - BASE_COMMITS ))
          if [ "$minor" -lt 0 ]; then
            echo "::error::commit count ($count) is below BASE_COMMITS ($BASE_COMMITS) — history was rewritten; re-baseline the env block"
            exit 1
          fi
          echo "version=0.$minor.0" >> "$GITHUB_OUTPUT"
          echo "$count commits -> 0.$minor.0" >> "$GITHUB_STEP_SUMMARY"

      # postinstall runs electron-rebuild, so better-sqlite3 lands on disk built
      # against Electron's ABI — which is also what `npm test` needs.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: linux
            files: dist/*.AppImage
          - os: windows-latest
            platform: win
            artifact: windows
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners default to pwsh; bash keeps both matrix legs identical.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Order is load-bearing: install -> stamp -> build -> package, with NO
      # reinstall in between. `postinstall` rebuilds better-sqlite3, so a later
      # npm install would clobber the native module packaged into the app.
      - run: npm ci

      - name: Stamp version
        run: npm version "${{ needs.verify.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm run build

      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --publish never

      # The cross-platform form of the `file ... | grep PE32+` check in
      # CLAUDE.md: PE binaries start with "MZ", Linux ELF with \x7fELF. Catches a
      # native module built for the wrong OS before it can reach a release.
      - name: Assert the packaged native module is a Windows binary
        if: matrix.platform == 'win'
        run: |
          node -e '
            const fs = require("fs")
            const p = "dist/win-unpacked/resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
            const magic = fs.readFileSync(p).subarray(0, 2).toString("binary")
            if (magic !== "MZ") {
              console.error("better_sqlite3.node is not a PE binary (magic: " + JSON.stringify(magic) + ")")
              process.exit(1)
            }
            console.log("better_sqlite3.node: PE binary OK")
          '

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          retention-days: 7
          # A build that silently produced nothing must fail here, not surface
          # as an empty release.
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          ls -lh artifacts
          # Re-running a failed release must not error on an existing tag.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" artifacts/* \
              --repo "$REPO" \
              --title "$TAG" \
              --target "${{ github.sha }}" \
              --generate-notes
          fi
